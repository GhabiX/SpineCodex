schema_version = 1

[limits]
trim_threshold_bytes = 10000

[prompt]
jit = '''<spine_instruction>
All work must be organized recursively in the SpineTree. Every piece of work
belongs to the active branch. A branch receives context inherited from its
ancestors, owns the context produced by its work, and manages the lifecycle of
that context.

When work should own a separate context lifecycle, issue `spine.open` in the
first interaction for that work. Apply this rule recursively within every
active branch. The child receives the parent context, while context produced
by the child's work belongs to the child.

Keep exact context while the branch's work needs it. When it no longer does,
return the state needed for later work as memory: use `spine.close` to continue
in the parent, or `spine.next` to continue in a sibling. Finalization replaces
the branch's local context with its memory in the parent. A following sibling
receives that parent context, including the finalized branch's memory.

Use Spine to keep context focused on the active work so you can complete the
task efficiently and with high quality.

Notes:

1. `<spine_memory>` contains memory from finalized branches.
2. Answer the user regardless of which branch you are in.
3. Each ReAct interaction may issue at most one of `spine.open`, `spine.close`,
   or `spine.next`. It may issue that transition with ordinary tool calls in
   the same `exec`. The transition applies to the active branch's prior ReAct
   history, while the ordinary tool calls execute in the resulting branch.

</spine_instruction>
'''
node = '''You have just entered this Spine node. The immediately following
`spine.open` or `spine.next` call created it and is the first action owned by
this node. Keep all subsequent investigation, edits, validation, and decisions
inside this node while they serve its stated scope.

As less context remains available to this node, give progressively more
consideration to finishing or precisely bounding its scope and finalizing it
with `spine.close` or `spine.next`.

Before leaving, finish the scope or bound every remaining uncertainty. Use
`spine.next` only when this node is finished and the next work is a true sibling
under the same parent. Use `spine.close` only when this node is finished and
continuation belongs in its immediate parent. In either transition, preserve in
`memory` the decisions, evidence, results, unresolved risks, and remaining
obligations needed to continue correctly without replaying this node's detail.'''
trim = ""
spawn = ""
spawn_explicit_request_only = "Do not use the MultiAgent collaboration tools to spawn sub-agents unless the user or applicable AGENTS.md/skill instructions explicitly ask for sub-agents, delegation, or parallel agent work. This restriction applies only to the MultiAgent collaboration surface and does not restrict independently available tools such as spine.spawn."
spawn_proactive = "Proactive MultiAgent collaboration is active. Any earlier instruction requiring an explicit user request before using the MultiAgent collaboration tools no longer applies. Use those collaboration tools when parallel work would materially improve speed or quality. This policy does not govern independent tools such as spine.spawn. This mode remains active until a later multi-agent mode developer message changes it."

[tools.open]
description = "Enter a direct child under the active branch. The child inherits the parent context and owns the context produced by its work. `spine.open` does not reduce context; reduction occurs when the branch is finalized with `spine.close` or `spine.next`. Co-issued ordinary tools execute in and belong to the child; the transition applies to the active branch's prior ReAct history."

[tools.close]
description = "Finalize the active branch, replace its local working context with returned memory, and return to its immediate parent. Use when continuation no longer needs the exact branch-owned context and the returned memory is sufficient. The root epoch cannot be finalized or closed. Co-issued ordinary tools execute in and belong to the parent; the transition applies to the active branch's prior ReAct history."

[tools.next]
description = "Finalize the active branch, replace its local working context with returned memory in the parent, and enter a true sibling under that parent. The sibling receives the parent context, including the finalized branch's memory, and owns the context produced by its work. Use when continuation no longer needs the exact branch-owned context and the returned memory is sufficient. The root epoch has no parent, so `spine.next` is invalid there. Co-issued ordinary tools execute in and belong to the sibling; the transition applies to the active branch's prior ReAct history."

[tools.trim]
description = "Conservatively trim one tagged tool-result projection without changing the Spine tree or creating memory. A TRIM_ID is valid only for the immediately preceding tool-result batch and expires after the next assistant tool request; after a miss, do not retry it. Use slice to retain needed evidence, use snip only after useful facts are preserved, and otherwise leave the result unchanged."

[tools.spawn]
description = "Fission the current work into two or more concurrent peer branches created from the current full history. Each branch receives a differentiated assignment and must own a semantically independent direction: either resolve a concrete uncertainty or produce an independently verifiable outcome, with an explicit scope, evidence boundary, and completion predicate. A branch may investigate, review, or implement directly and must return one terminal final memory. Give every branch a concise summary that is unique within this spawn call; the runtime uses it as the branch's public identity. Every spine.spawn call uses one task-local shared blackboard directory. Before calling spine.spawn, the parent must provision the directory and repeat the same `Shared blackboard: <path>` line in every task prompt so branches can coordinate, share useful findings, and reduce duplicated exploration. For exploration or review, treat inherited analytical conclusions as hypotheses to verify, refine, or falsify against primary evidence. The original continuation is suspended during the fission; no supervisory model remains active. Join waits for every branch, records their terminal results as finalized task branches under the current Spine scope atomically in input order, and then resumes the original continuation. Call spine.spawn at most once in one model response; place every concurrent branch in that call's tasks array. Use spine.spawn only when the current work has at least two substantial, self-contained, independently completable branches and concurrent execution would materially improve speed or result quality. Each branch must be able to complete with a bounded fallback rather than depending on another branch's result. For one bounded delegated subtask, incremental assistance, or work that benefits from ongoing parent supervision, use the ordinary multi-agent spawn tool when available or continue locally. Do not spawn paraphrased branches over the same tightly coupled question unless they are deliberately assigned as independent replication or falsification. Branch workspace and external effects are non-transactional, so production-file writes require disjoint ownership or one explicitly named integration owner."
