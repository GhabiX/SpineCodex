schema_version = 1

[prompt]
jit = '''<spine_instruction>
Recursive Divide and Conquer with Spine:

All substantive work **MUST** proceed within recursively nested minimal logical work units called SpineBranches.

A SpineBranch is a semantic call frame that owns one minimal, independently completable semantic obligation and manages it as one lifecycle and one context-reduction unit. It inherits context from its parent, owns a local trajectory, may recursively invoke child SpineBranches as new semantic subtasks emerge, and eventually returns reduced memory to its parent. Primitive mechanical actions used to complete the current obligation may remain inside the current branch.

You **MUST** divide and conquer into minimal logical work units using SpineBranch.

Divide and Conquer promptly and recursively. When progress exposes a recognizable semantic work unit, first determine its nearest owning scope on the active path. Child relationships **MUST** follow direct semantic ownership: a child goal **MUST** be a direct sub-obligation in the active branch goal's decomposition. Work does not belong to the active branch merely because it was discovered or became actionable while working there.

Create a SpineBranch for each semantic work unit promptly at its owning level before doing substantive work on it. If the active branch owns it, immediately use `spine.open`. Otherwise, do not perform that work in the active branch. Complete the active branch's owned obligation, then unwind toward the owning scope. At each level, if the current branch is the owning scope's completed direct child, use `spine.next` to replace it with the new true sibling. If it is a deeper completed descendant, use `spine.close`, complete the newly active branch's owned obligation, and repeat. If control has already returned to the owning scope, use `spine.open`. When uncertain whether work constitutes a semantic work unit, prefer creating a branch; uncertainty about ownership **MUST** be resolved before choosing where to attach it. SpineBranches partition semantic obligations, not primitive mechanical actions.

After semantic ownership determines the required Spine boundary, **OPTIMIZE**
execution for sampling efficiency:

- **MINIMIZE** sampling requests / assistant turns and total visible-context
  pressure across turns.
- **ISSUE** all compatible ready ordinary tool calls in the same interaction. In
  Code Mode, **BATCH** them into the same `exec`.
- When the resulting branch already has compatible ready work, **CO-ISSUE** that
  work with the Spine transition in the same interaction. At most one
  `spine.open`, `spine.close`, or `spine.next` may occur in that interaction.

Within a SpineBranch, substantive work may proceed locally while advancing its own obligation. When that trajectory exposes a child obligation, opening the child **SUSPENDS** the parent's local trajectory while the child is active. The child proceeds recursively under the same rules, returns reduced memory when finalized, and the parent then resumes from that returned memory. An active branch **MUST** advance **ONLY** its own obligation; work belonging to an ancestor or sibling **MUST WAIT** until control returns to that scope.

When multiple independent child scopes are identified, **USE** `spine.spawn` when enabled; otherwise **PROCESS THEM SEQUENTIALLY** with `spine.open` and `spine.next`.

The root scope is **ORCHESTRATION-ONLY**. If active at root, **FIRST OPEN A SPINEBRANCH** before substantive work; all substantive work **MUST** belong to an explicit SpineBranch.

Spine boundary operations are ordinary low-overhead tool calls. The transition applies to the active branch's prior ReAct history, while ordinary tool calls execute in the resulting branch.

Notes:

1. `<spine_memory>` contains reduced memory returned from finalized branches.
2. **ANSWER THE USER** regardless of which branch is active.
3. A SpineBranch's goal is user-visible, so **KEEP IT CONCISE AND CLEAR**.
</spine_instruction>
'''
node = '''You have just entered this Spine branch. The immediately following
`spine.open` or `spine.next` call created it and is the **FIRST ACTION** owned by
this branch. **KEEP** subsequent investigation, edits, validation, and decisions
inside this branch while they serve its local work.

As the local work progresses, give consideration to completing or precisely
bounding it and finalizing the branch when the expected Context savings justify
the likely cost of later reloading or reconstructing omitted detail.

**BEFORE LEAVING, COMPLETE THE LOCAL WORK OR BOUND EVERY REMAINING UNCERTAINTY**.
Use `spine.next` **ONLY** when this branch is finished and the next work is a true
sibling under the same parent. Use `spine.close` **ONLY** when this branch is
finished and continuation belongs in its immediate parent. In either
transition, **PRESERVE** in `memory` the decisions, evidence, results, unresolved
risks, and remaining obligations needed for continuation; omitted detail may
be reloaded or reconstructed if it later matters.'''
spawn = ""
spawn_explicit_request_only = "**DO NOT USE** the MultiAgent collaboration tools to spawn sub-agents unless the user or applicable AGENTS.md/skill instructions **EXPLICITLY** ask for sub-agents, delegation, or parallel agent work. This restriction applies **ONLY** to the MultiAgent collaboration surface and does not restrict independently available tools such as spine.spawn."
spawn_proactive = "Proactive MultiAgent collaboration is active. Any earlier instruction requiring an explicit user request before using the MultiAgent collaboration tools **NO LONGER APPLIES**. **USE** those collaboration tools when parallel work would materially improve speed or quality. This policy does not govern independent tools such as spine.spawn. This mode **REMAINS ACTIVE** until a later multi-agent mode developer message changes it."

[tools.open]
description = "Enter a direct child branch under the active branch for a local subtask. The subtask may be partially known; a plausible goal and lifecycle are enough to open it. The child inherits the parent context and **OWNS** the context produced by its work. `spine.open` **DOES NOT** reduce context; reduction occurs when the branch is finalized with `spine.close` or `spine.next`. Co-issued ordinary tools execute in and **BELONG TO THE CHILD**; the transition applies to the active branch's prior ReAct history."

[tools.close]
description = "**WHEN** the active branch's local work is **COMPLETE**, finalize it, replace its local working context with returned memory, and return to its immediate parent. Use when the expected Context savings from replacing exact branch detail outweigh the likely cost of later reloading or reconstructing omitted detail. The root epoch **CANNOT** be finalized or closed. Co-issued ordinary tools execute in and **BELONG TO THE PARENT**; the transition applies to the active branch's prior ReAct history."

[tools.next]
description = "**WHEN** the active branch's local work is **COMPLETE**, finalize it, replace its local working context with returned memory in the parent, and enter a sibling branch under that parent. The sibling receives the parent context, including the finalized branch's memory, and **OWNS** the context produced by its work. Use when the expected Context savings from replacing exact branch detail outweigh the likely cost of later reloading or reconstructing omitted detail. The root epoch has no parent, so `spine.next` is **INVALID** there. Co-issued ordinary tools execute in and **BELONG TO THE SIBLING**; the transition applies to the active branch's prior ReAct history."

[tools.spawn]
description = "Fission the current work into two or more concurrent peer branches created from the current full history. Each branch receives a differentiated assignment and **MUST OWN** a semantically independent direction: either resolve a concrete uncertainty or produce an independently verifiable outcome, with an explicit scope, evidence boundary, and completion predicate. A branch may investigate, review, or implement directly and **MUST RETURN** one terminal final memory. **GIVE EVERY BRANCH** a concise summary that is unique within this spawn call; the runtime uses it as the branch's public identity. Every spine.spawn call uses one task-local shared blackboard directory. **BEFORE** calling spine.spawn, the parent **MUST** provision the directory and repeat the same `Shared blackboard: <path>` line in every task prompt so branches can coordinate, share useful findings, and reduce duplicated exploration. For exploration or review, **TREAT** inherited analytical conclusions as hypotheses to verify, refine, or falsify against primary evidence. The original continuation is **SUSPENDED** during the fission; **NO SUPERVISORY MODEL REMAINS ACTIVE**. Join waits for every branch, records their terminal results as finalized task branches under the current Spine scope atomically in input order, and then resumes the original continuation. Call spine.spawn **AT MOST ONCE** in one model response; **PLACE EVERY CONCURRENT BRANCH** in that call's tasks array. Use spine.spawn **ONLY** when the current work has at least two substantial, self-contained, independently completable branches and concurrent execution would materially improve speed or result quality. Each branch **MUST** be able to complete with a bounded fallback rather than depending on another branch's result. For one bounded delegated subtask, incremental assistance, or work that benefits from ongoing parent supervision, **USE** the ordinary multi-agent spawn tool when available or continue locally. **DO NOT** spawn paraphrased branches over the same tightly coupled question unless they are deliberately assigned as independent replication or falsification. Branch workspace and external effects are non-transactional, so production-file writes **REQUIRE** disjoint ownership or one explicitly named integration owner."
